<div class="container">
  <div>
    <label>{{label()}}</label>
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated {{bgColor()}}" role="progressbar" [style.width.%]="100 * value() / max()" [attr.aria-valuenow]="value()"  [attr.aria-valuemin]="min()"  [attr.aria-valuemax]="max()">{{( 100 * value() / max()).toFixed(2)}} %</div>
    </div>
    <div class="float-left">
      {{parentValue()}}
    </div>
    <div class="float-right">
      {{(parentValue() >= maxParentValue() ? startValue() : parentValue()+1)}}
    </div>
  </div>
</div>
