<div class="progress-card">
  <div class="progress-head">
    <label>{{label()}}</label>
    <span class="progress-percent">{{(100 * value() / max()).toFixed(2)}}%</span>
  </div>

  <div class="progress">
    <div
      class="progress-bar {{bgColor()}}"
      role="progressbar"
      [style.width.%]="100 * value() / max()"
      [attr.aria-valuenow]="value()"
      [attr.aria-valuemin]="min()"
      [attr.aria-valuemax]="max()"
    >
      {{(100 * value() / max()).toFixed(2)}}%
    </div>
  </div>

  <div class="progress-meta">
    <span>{{parentValue()}}</span>
    <span>{{(parentValue() >= maxParentValue() ? startValue() : parentValue()+1)}}</span>
  </div>
</div>
